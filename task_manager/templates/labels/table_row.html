<tr>
    <td>{{ item.id }}</td>
    <td>{{ item.name }}</td>
    <td>{{ item.created_at|date:"d.m.y H:i" }}</td>
    <td>
        <a href="{% url 'labels:update' item.id %}" class="btn btn-sm btn-warning">
        <i class="bi bi-pencil"></i> Изменить
    </a>
    <a href="{% url 'labels:delete' item.id %}" class="btn btn-sm btn-danger">
        <i class="bi bi-trash"></i> Удалить
    </a>
    </td>
</tr>
