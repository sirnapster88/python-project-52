{% extends 'base.html' %}

{% block title %} {{ title }} {% endblock %}

{% block content %}

<div class="container mt-4">
    <h4 class="mb-0">{{ delete_title }}</h4>
       <p>
        {% if delete_message %}
            {{ delete_message }}
        {% else %}
            Вы уверены, что хотите удалить {{ object }}?
        {% endif %}
    </p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">
                {{ submit_button }}
            </button>
        </form>
</div>



{% endblock %}
