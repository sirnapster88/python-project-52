<tr>
    <td>{{ item.id }}</td>
    <td><strong>{{ item.username }}</strong></td>
    <td>
        {% if item.first_name or item.last_name %}
            {{ item.first_name }} {{ item.last_name }}
        {% else %}
            <span class="text-muted">—</span>
        {% endif %}
    </td>
    <td>{{ item.date_joined|date:"d.m.Y H:i" }}</td>
    <td>
        <a href="{% url 'users:update' item.id %}" class="btn btn-sm btn-warning">
            <i class="bi bi-pencil"></i> Изменить
        </a>
        <a href="{% url 'users:delete' item.id %}" class="btn btn-sm btn-danger">
            <i class="bi bi-trash"></i> Удалить
        </a>
    </td>
</tr>
